    <!--
      Runtime font preload. The @font-face rules ship in the bundled CSS; this
      tiny hint asks the browser to fetch the three faces the hero needs as early
      as possible. It resolves the URL against the page's own path so the site
      works both at the root and from a sub-path (base: './').
    -->
    <script>
      (function () {
        var dir = (location.pathname.match(/^(.*\/)[^/]*$/) || ['', '/'])[1];
        ['fraunces-normal-latin.woff2', 'fraunces-italic-latin.woff2', 'hanken-normal-latin.woff2'].forEach(function (f) {
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'font';
          l.type = 'font/woff2';
          l.crossOrigin = '';
          l.href = dir + 'fonts/' + f;
          document.head.appendChild(l);
        });
      })();
    </script>
    <!--
      Progressive-enhancement failsafe. GSAP may only hide content from JS, and
      only immediately before animating it; nothing is hidden by plain CSS. If
      the intro has still not started 1.5s after DOMContentLoaded (a stalled
      bundle, a GSAP error, a blocked deferred script), this forces every hidden
      reveal back to its visible state. Exposed as a function so the behaviour
      can be asserted by the review suite.
    -->
    <script>
      (function () {
        function unHide(el) {
          el.style.setProperty('opacity', '1', 'important');
          el.style.setProperty('visibility', 'visible', 'important');
          el.style.setProperty('transform', 'none', 'important');
        }

        function forceVisible() {
          if (window.__agIntroStarted) return 0;
          var hidden = 0;
          var marked = document.querySelectorAll('[data-hero-reveal], [data-reveal]');
          for (var i = 0; i < marked.length; i++) {
            unHide(marked[i]);
            hidden += 1;
          }
          /* SplitText wraps the headline in JS-generated line boxes; any other
             element GSAP left at opacity 0 is caught here too. */
          var styled = document.querySelectorAll('[style]');
          for (var j = 0; j < styled.length; j++) {
            var el = styled[j];
            if (el.style.opacity === '0' || el.style.visibility === 'hidden') {
              unHide(el);
              hidden += 1;
            }
          }
          return hidden;
        }

        window.__agIntroFailsafe = forceVisible;

        function arm() {
          window.setTimeout(forceVisible, 1500);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', arm);
        } else {
          arm();
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
